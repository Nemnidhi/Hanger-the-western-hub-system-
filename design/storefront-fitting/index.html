<title>Hanger Fitting Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* Layout: the boutique's fitting room. An arched brass mirror with a dress form on the left,
   the rail on the right (dresses / tops / bottoms / layer). Tap a piece and it goes on the form;
   the look's pieces, sizes and total sit under the mirror. One light look by choice. */
:root {
  --wall: #e3e9e4;
  --wall-2: #d5ded7;
  --paper: #f8faf7;
  --ink: #17221e;
  --mute: #5a6962;
  --line: #cbd6cf;
  --curtain: #1f3a31;
  --curtain-2: #2f5649;
  --brass: #b4853f;
  --brass-hi: #e3c486;
  --form: #dccfc2;
  --form-sh: #c3b2a3;
  --flag: #b2405f;
  --display: "Gloock", "Bodoni 72", Georgia, serif;
  --sans: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wall); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--curtain); outline-offset: 3px; }
.wrap { width: min(1320px, 100% - 32px); margin-inline: auto; }
.num { font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -.005em; }

.preview-band { background: var(--curtain); color: var(--brass-hi); font-size: 12.5px; text-align: center; padding: 8px 16px; line-height: 1.4; }
.preview-band b { color: var(--paper); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; margin-right: 6px; }

/* Header with the curtain pelmet */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--curtain); color: var(--paper); }
header::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; background: repeating-linear-gradient(90deg, var(--curtain) 0 18px, var(--curtain-2) 18px 24px, var(--curtain) 24px 36px); -webkit-mask: radial-gradient(18px 14px at 18px 0, #000 98%, transparent) 0 0 / 36px 14px repeat-x; mask: radial-gradient(18px 14px at 18px 0, #000 98%, transparent) 0 0 / 36px 14px repeat-x; }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 62px; }
.logo { display: flex; align-items: baseline; gap: 10px; font-family: var(--display); font-size: 26px; }
.logo small { font-family: var(--sans); font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--brass-hi); }
.head-tools { display: flex; align-items: center; gap: 6px; }
.head-tools a, .head-tools button { padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.head-tools a:hover, .head-tools button:hover { background: rgba(255, 255, 255, .08); }
.bag-n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 6px; border-radius: 11px; background: var(--brass); color: var(--ink); font-size: 12px; font-weight: 700; }

/* Room */
.room { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 40px; padding-block: 40px 60px; align-items: start; }
.mirror-col { position: sticky; top: 92px; display: grid; gap: 18px; }
.scene { position: relative; display: grid; place-items: center; padding: 0 10%; }
.curtain { position: absolute; top: -40px; bottom: 30px; width: 12%; background: repeating-linear-gradient(90deg, var(--curtain) 0 10px, var(--curtain-2) 10px 13px, var(--curtain) 13px 22px); border-radius: 0 0 40% 40%; box-shadow: inset -10px 0 20px rgba(0, 0, 0, .25); }
.curtain.l { left: 0; border-bottom-right-radius: 70%; }
.curtain.r { right: 0; border-bottom-left-radius: 70%; transform: scaleX(-1); }
.mirror { position: relative; width: 100%; max-width: 440px; aspect-ratio: 3 / 4.25; border-radius: 999px 999px 26px 26px / 48% 48% 26px 26px; padding: 12px; background: linear-gradient(150deg, var(--brass-hi), var(--brass) 40%, #7d5a26 70%, var(--brass-hi)); box-shadow: 0 30px 60px -30px rgba(23, 34, 30, .55); }
.glass { position: relative; width: 100%; height: 100%; border-radius: inherit; overflow: hidden; background: radial-gradient(90% 60% at 50% 30%, #fbfcfa 0%, #e8eee9 55%, #cfd9d2 100%); }
.glass::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .55) 38%, transparent 46%); pointer-events: none; z-index: 5; }
.glass::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: 4%; height: 5%; border-radius: 50%; background: radial-gradient(rgba(23, 34, 30, .22), transparent 70%); }
.stack { position: absolute; inset: 7% 4% 3%; z-index: 2; animation: breathe 6s ease-in-out infinite; transform-origin: 50% 100%; }
.stack svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stack svg.fresh { animation: drop .55s var(--ease); }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
@keyframes breathe { 50% { transform: scale(1.006, 1.004); } }
.mirror-tag { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); z-index: 6; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: 13px; white-space: nowrap; box-shadow: 0 8px 20px -12px rgba(23, 34, 30, .5); }
.mirror-tag b { font-family: var(--display); font-weight: 400; font-size: 16px; }

.look-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.look-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.look-top h2 { font-size: 30px; }
.look-total { font-size: 22px; font-weight: 600; }
.worn { display: grid; gap: 0; }
.worn-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.worn-row .sw { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; }
.worn-row .sw svg { width: 100%; height: 100%; }
.worn-row b { font-weight: 600; font-size: 14.5px; display: block; line-height: 1.2; }
.worn-row small { color: var(--mute); font-size: 12.5px; }
.worn-row small.warn { color: var(--flag); font-weight: 600; }
.sel { border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; background: var(--paper); font-size: 14px; }
.x { width: 30px; height: 30px; border-radius: 50%; color: var(--mute); }
.x:hover { background: var(--wall); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 22px; border-radius: 999px; font-weight: 600; font-size: 15px; border: 1px solid var(--ink); }
.btn.dark { background: var(--curtain); color: var(--paper); border-color: var(--curtain); }
.btn.dark:hover { background: var(--ink); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.btn.block { width: 100%; }
.btn.small { padding: 9px 14px; font-size: 13.5px; }
.look-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }

/* Rail */
.rail-col { display: grid; gap: 22px; min-width: 0; }
.intro h1 { font-size: clamp(40px, 4.6vw, 64px); line-height: 1; }
.intro p { max-width: 52ch; margin: 10px 0 0; color: var(--mute); }
.my-size { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; }
.pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.styled { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.styled .pill { flex: none; display: flex; align-items: center; gap: 8px; }
.styled .pill i { width: 10px; height: 10px; border-radius: 50%; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
.tab { padding: 12px 18px; font-weight: 500; color: var(--mute); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-color: var(--ink); }
.tab .c { font-size: 12px; color: var(--mute); margin-left: 4px; }
.rod { height: 8px; border-radius: 4px; background: linear-gradient(var(--brass-hi), var(--brass) 60%, #7d5a26); box-shadow: 0 4px 8px -4px rgba(0, 0, 0, .4); margin-bottom: -18px; position: relative; z-index: 1; }
.rail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.piece { position: relative; text-align: left; border-radius: 0 0 18px 18px; transition: transform .3s var(--ease); }
.piece .art { aspect-ratio: 3 / 4; max-width: 100%; }
.piece .art svg { width: 100%; height: 100%; }
.piece .meta { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px; font-size: 14px; }
.piece .meta b { font-weight: 600; }
.piece .on-tag { position: absolute; left: 8px; top: 26px; background: var(--curtain); color: var(--paper); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; }
.piece .left { position: absolute; right: 8px; top: 26px; background: var(--paper); color: var(--flag); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; }
.piece:hover { transform: translateY(4px); }
.piece.worn-now .art { filter: saturate(1.05); }
.piece.none { display: grid; place-items: center; aspect-ratio: 3 / 4; border: 1.5px dashed var(--line); border-radius: 18px; margin-top: 24px; color: var(--mute); font-size: 14px; text-align: center; padding: 10px; }
.saved h3 { font-size: 24px; margin-bottom: 10px; }
.saved-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.saved-look { flex: none; width: 96px; text-align: center; font-size: 12.5px; }
.saved-look .mini { position: relative; aspect-ratio: 3 / 4.1; border-radius: 48px 48px 12px 12px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-bottom: 4px; }
.saved-look .mini svg { position: absolute; inset: 4%; width: 92%; height: 92%; }
.promise { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.promise div { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; font-size: 14px; }
.promise b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; }

/* Bottom bar on phones */
.bar { display: none; }

/* Panels */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(23, 34, 30, .42); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.panel { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); transform: translateX(102%); transition: transform .5s var(--ease); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.panel.on { transform: none; }
.panel-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 30px; }
.panel-body { flex: 1; overflow: auto; padding: 4px 22px; }
.panel-foot { padding: 16px 22px 22px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.b-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.b-row .sw { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; }
.b-row .sw svg { width: 100%; height: 100%; }
.qty { display: inline-flex; align-items: center; gap: 10px; margin-top: 4px; }
.qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); }
.row { display: flex; justify-content: space-between; font-size: 14.5px; }
.row.total { font-size: 18px; font-weight: 600; padding-top: 4px; }
.meter { height: 6px; border-radius: 3px; background: var(--wall-2); overflow: hidden; margin: 2px 0 6px; }
.meter i { display: block; height: 100%; background: var(--brass); }
.modal { position: fixed; z-index: 52; left: 50%; top: 50%; width: min(520px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow: auto; background: var(--paper); border-radius: 26px; padding: 24px; transform: translate(-50%, -46%); opacity: 0; pointer-events: none; transition: transform .4s var(--ease), opacity .3s; }
.modal.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.m-top { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 18px; align-items: center; }
.m-top .art { aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; }
.m-top .art svg { width: 100%; height: 100%; }
dl.facts { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; margin: 16px 0 0; }
dl.facts dt { color: var(--mute); }
dl.facts dd { margin: 0; }

/* Checkout */
.co { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 36px; padding-block: 40px 80px; }
.co-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 22px; margin-bottom: 14px; }
.co-card h3 { font-size: 26px; margin-bottom: 12px; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--mute); margin-bottom: 12px; }
.input { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 0 14px; font: inherit; color: var(--ink); }
.input:focus { outline: none; border-color: var(--curtain); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pays { display: grid; gap: 8px; }
.pay { display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; }
.pay small { display: block; color: var(--mute); }
.pay.on { border-color: var(--curtain); box-shadow: inset 0 0 0 1px var(--curtain); }
.demo { background: var(--wall-2); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; }
.sum-card { position: sticky; top: 96px; align-self: start; }
.thanks { padding-block: 60px 90px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.thanks h1 { font-size: clamp(56px, 8vw, 110px); line-height: .92; }

.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 160%); visibility: hidden; transition: transform .45s var(--ease); background: var(--ink); color: var(--paper); padding: 13px 20px; border-radius: 16px; font-size: 14px; max-width: calc(100% - 32px); }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.swing { transform-box: view-box; transform-origin: 150px 18px; animation: sway 7s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }

@media (max-width: 980px) {
  .room { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-block: 26px 120px; }
  .mirror-col { position: static; }
  .mirror { max-width: 360px; }
  .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .co, .thanks { grid-template-columns: minmax(0, 1fr); }
  .sum-card { position: static; }
  .look-actions { grid-template-columns: minmax(0, 1fr) auto; }
  .look-actions .btn.dark { grid-column: 1 / -1; }
  .bar { display: flex; position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; gap: 12px; align-items: center; justify-content: space-between; background: var(--paper); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -14px 30px -20px rgba(23, 34, 30, .5); }
  .bar b { font-size: 18px; }
}
@media (max-width: 560px) {
  .rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .promise { grid-template-columns: minmax(0, 1fr); }
  .head-tools a { display: none; }
  .tab { padding: 10px 12px; font-size: 14.5px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .curtain { width: 9%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .001ms !important; }
}
</style>

  $("#lookCard").innerHTML = `<div class="look-top"><h2>${lookName}</h2><span class="look-total num">${rupees(lookTotal())}</span></div>
    <div class="worn">${codes.map((c) => { const p = byCode[c], s = sizeFor(c), left = p.stock[s]; return `<div class="worn-row"><span class="sw" style="background:${p.bg}">${garment(p, { label: false, viewBox: "60 70 180 200" })}</span>
      <span><b>${p.name}</b><small class="${left ? (left <= 1 ? "warn" : "") : "warn"}">${rupees(p.price)} · ${left ? (left <= 2 ? `${left} left in ${s}` : fitWords(p)) : `${s} is sold out`}</small> <button class="mute" style="font-size:12.5px;text-decoration:underline" onclick="details('${c}')">Details</button></span>
      <select class="sel" aria-label="Size for ${p.name}" onchange="sizes['${c}']=this.value;drawMirror();drawBar()">${sizesOf(p).map((k) => `<option value="${k}" ${k === s ? "selected" : ""} ${p.stock[k] ? "" : "disabled"}>${k}${p.stock[k] ? "" : " (sold out)"}</option>`).join("")}</select>
      <button class="x" aria-label="Take off ${p.name}" onclick="takeOff('${c}')">✕</button></div>`; }).join("")}</div>
    <div class="look-actions"><button class="btn dark" onclick="addLook()">Add the whole look · ${rupees(lookTotal())}</button><button class="btn small" onclick="saveLook()">Save look</button><button class="btn small" onclick="toast('In the live shop the store keeps the whole look aside for a day (design preview).')">Try at store</button></div>`;
}
function drawRail() {
  $("#tabs").innerHTML = Object.entries(SLOTS).map(([k, s]) => `<button class="tab ${k === tab ? "on" : ""}" role="tab" onclick="tab='${k}';drawRail()">${s.name}<span class="c">${s.codes.length}</span></button>`).join("");
  const worn = wornCodes();
  $("#rail").innerHTML = SLOTS[tab].codes.map((c) => { const p = byCode[c], n = totalLeft(p), on = worn.includes(c); return `<button class="piece ${on ? "worn-now" : ""}" onclick="wear('${c}')" aria-pressed="${on}" aria-label="Put on ${p.name}"><div class="art">${garment(p, { label: false })}</div>${on ? `<span class="on-tag">On the form</span>` : ""}${n <= 4 ? `<span class="left">${n} left</span>` : ""}<div class="meta"><span>${p.name}</span><b class="num">${rupees(p.price)}</b></div></button>`; }).join("") + (tab === "layer" ? `<button class="piece none" onclick="look.layer=null;lookName='Your look';drawMirror();drawRail();drawBar()">No layer<br>today</button>` : "");
  $("#mySize").innerHTML = ["XS", "S", "M", "L", "XL"].map((k) => `<button class="pill ${k === mySize ? "on" : ""}" onclick="setMySize('${k}')">${k}</button>`).join("") + `<span class="mute" style="font-size:13px">Jeans follow as waist ${WAIST[mySize]}</span>`;
  drawSaved();
}
function setMySize(k) { mySize = k; sizes = {}; keep(); drawMirror(); drawRail(); drawBar(); }
function drawSaved() {
  $("#saved").innerHTML = saved.length ? `<h3>Your saved looks</h3><div class="saved-row">${saved.map((s, i) => `<button class="saved-look" onclick="wearSaved(${i})"><div class="mini">${figureFor(s.look).replace(/<svg /g, '<svg style="position:absolute;inset:4%;width:92%;height:92%" ')}</div>${s.name}<br><b class="num">${rupees(wornCodes(s.look).reduce((a, c) => a + byCode[c].price, 0))}</b></button>`).join("")}</div>` : "";
}
function saveLook() {
  const key = wornCodes().join("+");
  if (saved.some((s) => wornCodes(s.look).join("+") === key)) return toast("This look is already saved.");
  saved.unshift({ look: { ...look }, name: lookName === "Your look" || lookName === "A shuffled look" ? `Look ${saved.length + 1}` : lookName });
  saved = saved.slice(0, 8); keep(); drawSaved();
  toast("Saved on this device. In the live shop we can also send it to you on WhatsApp.");
}
function wearSaved(i) { look = { ...saved[i].look }; lookName = saved[i].name; fresh = ""; drawMirror(); drawRail(); drawBar(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function addLook() {
  const out = [];
  for (const c of wornCodes()) { const msg = bagAdd(c, sizeFor(c)); if (msg) out.push(msg); }
  updateN();
  if (out.length) toast(out[0]);
  openBag();
}
function drawBar() {
  const bar = $("#bar"); if (!bar || !$("#stack")) { if (bar) bar.innerHTML = ""; return; }
  bar.innerHTML = `<div><div class="mute" style="font-size:12.5px">${lookName} · ${wornCodes().length} pieces</div><b class="num">${rupees(lookTotal())}</b></div><button class="btn dark" onclick="addLook()">Add the look</button>`;
}
function details(code) {
  const p = byCode[code];
  $("#modal").innerHTML = `<div class="m-top"><div class="art" style="background:${p.bg}">${garment(p)}</div><div><div class="label mute">${p.cat} · ${p.code}</div><h2 style="font-size:32px;line-height:1.05;margin:6px 0">${p.name}</h2><b class="num" style="font-size:20px">${rupees(p.price)}</b> <span class="mute" style="font-size:13px">GST included</span></div></div>
    <p>${p.blurb}</p>
    <dl class="facts"><dt>Fit</dt><dd>${fitWords(p)}</dd><dt>Fabric</dt><dd>${p.fabricText}</dd><dt>In stock</dt><dd>${sizesOf(p).map((k) => `${k}: ${p.stock[k] || "sold out"}`).join(" · ")}</dd><dt>Goes with</dt><dd>${p.pairs.map((c) => byCode[c].name).join(", ")}</dd></dl>
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="btn dark" onclick="closeAll()">Back to the mirror</button></div>`;
  $("#modal").classList.add("on"); $("#scrim").classList.add("on");
}

function updateN() { $("#bagN").textContent = bagQty(); }
function closeAll() { ["#panel", "#modal", "#scrim"].forEach((s) => $(s).classList.remove("on")); }
function openBag() { drawBag(); $("#panel").classList.add("on"); $("#scrim").classList.add("on"); }
function drawBag() {
  const t = bagTotal(), d = deliveryFor(t), away = Math.max(0, FREE_SHIP - t);
  $("#panel").innerHTML = `<div class="panel-head"><h2>Your bag</h2><button class="x" aria-label="Close bag" onclick="closeAll()">✕</button></div>
  <div class="panel-body">${bag.length ? bag.map((l, i) => { const p = byCode[l.code]; return `<div class="b-row"><span class="sw" style="background:${p.bg}">${garment(p, { label: false })}</span><div><b style="font-weight:600">${p.name}</b><div class="mute" style="font-size:13px">Size ${l.size}</div><div class="qty"><button aria-label="One less" onclick="step(${i},-1)">−</button><span class="num">${l.qty}</span><button aria-label="One more" onclick="step(${i},1)">+</button></div></div><b class="num">${rupees(p.price * l.qty)}</b></div>`; }).join("") : `<div style="padding:50px 0;text-align:center"><h3 style="font-size:28px">Nothing in the bag yet</h3><p class="mute">Dress the form, then add the whole look in one tap.</p><button class="btn dark" onclick="closeAll()">Back to the mirror</button></div>`}</div>
  ${bag.length ? `<div class="panel-foot"><div class="mute" style="font-size:13.5px">${away ? `${rupees(away)} more for free delivery` : "Free delivery unlocked"}</div><div class="meter"><i style="width:${Math.min(100, (t / FREE_SHIP) * 100)}%"></i></div><div class="row"><span>Delivery</span><span class="num">${d ? rupees(d) : "Free"}</span></div><div class="row total"><span>Total, GST included</span><span class="num">${rupees(t + d)}</span></div><a class="btn dark block" style="margin-top:8px" href="#checkout" onclick="closeAll()">Checkout</a></div>` : ""}`;
}
function step(i, d) { bagStep(i, d); updateN(); drawBag(); }

let pay = "upi", lastOrder = null;
function checkoutPage() {
  if (!bag.length) return `<div class="wrap" style="padding:80px 0;text-align:center"><h1 style="font-size:44px">Your bag is empty</h1><p><a class="btn dark" href="#room">Back to the fitting room</a></p></div>`;
  pay = "upi";
  return `<div class="wrap co">
    <div>
      <h1 style="font-size:clamp(40px,5vw,60px);margin-bottom:14px">Checkout</h1>
      <p class="demo">Design preview: no code is sent, no payment is taken and no order is placed. Try it with made-up details.</p>
      <div class="co-card"><h3>Your number</h3><div class="field">WhatsApp number<input class="input" id="coPhone" inputmode="tel" maxlength="10" placeholder="10-digit mobile number" /></div><div class="mute" style="font-size:13.5px">No account or password. Updates and the GST invoice come on WhatsApp.</div></div>
      <div class="co-card"><h3>Delivery address</h3><div class="two"><div class="field">Full name<input class="input" id="coName" /></div><div class="field">Pincode<input class="input" id="coPin" inputmode="numeric" maxlength="6" placeholder="452010" oninput="pinFill()" /></div></div><div class="field">House, street, area<input class="input" id="coAddr" /></div><div class="two"><div class="field">City<input class="input" id="coCity" /></div><div class="field">State<input class="input" id="coState" /></div></div></div>
      <div class="co-card"><h3>Payment</h3><div class="pays">${[["upi", "UPI", "Any UPI app"], ["card", "Card", "Debit or credit"], ["cod", "Cash on delivery", "Pay when it arrives"]].map(([k, a, b]) => `<button type="button" class="pay ${k === "upi" ? "on" : ""}" data-k="${k}" onclick="setPay('${k}')"><span>${a}<small>${b}</small></span></button>`).join("")}</div></div>
    </div>
    <aside class="co-card sum-card" id="sumCard"></aside>
  </div>`;
}
function setPay(k) { pay = k; document.querySelectorAll(".pay").forEach((b) => b.classList.toggle("on", b.dataset.k === k)); drawSum(); }
function pinFill() { const v = $("#coPin").value.replace(/\D/g, ""), pl = pinPlace(v); if (pl && pl[0]) { $("#coCity").value = pl[0]; $("#coState").value = pl[1]; } drawSum(); }
function drawSum() {
  const t = bagTotal(), d = deliveryFor(t), pin = ($("#coPin")?.value || "").replace(/\D/g, "");
  $("#sumCard").innerHTML = `<h3>Your order</h3>${bag.map((l) => { const p = byCode[l.code]; return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${p.name} · ${l.size}${l.qty > 1 ? ` × ${l.qty}` : ""}</span><span class="num">${rupees(p.price * l.qty)}</span></div>`; }).join("")}
    <div class="row" style="padding-top:8px"><span>Delivery</span><span class="num">${d ? rupees(d) : "Free"}</span></div><div class="row mute"><span>GST included</span><span class="num">${rupees(Math.round(t - t / 1.05))}</span></div><div class="row total"><span>Total</span><span class="num">${rupees(t + d)}</span></div>
    <p class="mute" style="font-size:13.5px">${/^\d{6}$/.test(pin) ? `Arrives <b style="color:var(--ink)">${etaFor(pin).toLowerCase()}</b>` : "Add your pincode to see the delivery day."}</p>
    <button class="btn dark block" onclick="placeOrder()">${pay === "cod" ? "Place order" : `Pay ${rupees(t + d)}`}</button>`;
}
function placeOrder() {
  const phone = $("#coPhone").value.replace(/\D/g, ""), pin = $("#coPin").value.replace(/\D/g, "");
  if (phone.length !== 10) return toast("Add a 10-digit mobile number.");
  if (!$("#coName").value.trim() || !$("#coAddr").value.trim() || pin.length !== 6) return toast("Add your name, address and a 6-digit pincode.");
  const worn = bag.map((l) => l.code);
  lastOrder = { n: 1000 + Math.floor(Math.random() * 9000), eta: etaFor(pin), total: bagTotal() + deliveryFor(bagTotal()), look: { dress: worn.find((c) => slotOf(c) === "dress") || null, top: worn.find((c) => slotOf(c) === "top") || null, bottom: worn.find((c) => slotOf(c) === "bottom") || null, layer: worn.find((c) => slotOf(c) === "layer") || null } };
  if (!lastOrder.look.dress && !lastOrder.look.top && !lastOrder.look.bottom) lastOrder.look.top = "TOP-030";
  if (lastOrder.look.dress) { lastOrder.look.top = null; lastOrder.look.bottom = null; }
  bag = []; saveBag(); updateN();
  location.hash = "#thanks";
}
function thanksPage() {
  if (!lastOrder) return `<div class="wrap" style="padding:80px 0;text-align:center"><h1 style="font-size:44px">No order yet</h1><p><a class="btn dark" href="#room">Back to the fitting room</a></p></div>`;
  return `<div class="wrap thanks">
    <div class="scene"><span class="curtain l"></span><span class="curtain r"></span><div class="mirror" style="max-width:340px"><div class="glass"><div class="stack">${figureFor(lastOrder.look)}</div></div></div></div>
    <div><div class="label mute">Order HWH-${lastOrder.n} · ${rupees(lastOrder.total)} · design preview</div><h1 style="margin-top:12px">It's yours.</h1><p style="font-size:18px;max-width:40ch">Packed by hand at MG Road and at your door ${lastOrder.eta.toLowerCase()}. Tracking comes on WhatsApp, and any size can be exchanged within 7 days.</p><a class="btn dark" href="#room">Dress another look</a></div>
  </div>`;
}

function route() {
  const [page, sub] = parseHash();
  closeAll();
  const main = $("#main");
  if (page === "checkout") main.innerHTML = checkoutPage();
  else if (page === "thanks") main.innerHTML = thanksPage();
  else {
    if (page === "look") useStyled(sub);
    main.innerHTML = room();
    drawMirror(); drawRail();
  }
  drawBar();
  if (page === "checkout" && bag.length) drawSum();
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => e.key === "Escape" && closeAll());
updateN();
route();
</script>
