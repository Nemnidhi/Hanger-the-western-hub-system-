<title>Hanger Storefront Themes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=Bricolage+Grotesque:wght@500;700&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Fraunces:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet" />
<style>
/* Layout: the four directions in one shop. Story circles open the drop (stories), the drop reads
   like an issue with look numbers (editorial), every piece opens in the fitting room with the
   shop's picks beside the mirror, and a staff screen does the same for the real trial room.
   One light look by choice; the story viewer is dark by design. */
:root {
  --wall: #e3e9e4;
  --wall-2: #d5ded7;
  --paper: #f8faf7;
  --ink: #17221e;
  --mute: #56655e;
  --line: #cbd6cf;
  --curtain: #1f3a31;
  --curtain-2: #2f5649;
  --brass: #b4853f;
  --brass-hi: #e3c486;
  --form: #dccfc2;
  --flag: #b2405f;
  --good: #2f7a55;
  --night: #0c0a0d;
  --rose: #f0b9a6;
  --ring: conic-gradient(from 210deg, #d8af6c, #f0b9a6, #a03d66, #d8af6c);
  --display: "Gloock", "Bodoni 72", Georgia, serif;
  --story: "Instrument Serif", Georgia, serif;
  --sans: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wall); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--curtain); outline-offset: 3px; }
.wrap { width: min(1320px, 100% - 32px); margin-inline: auto; }
.num { font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }

.preview-band { background: var(--curtain); color: var(--brass-hi); font-size: 12.5px; text-align: center; padding: 8px 16px; line-height: 1.4; }
.preview-band b { color: var(--paper); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; margin-right: 6px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--curtain); color: var(--paper); }
header::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; background: repeating-linear-gradient(90deg, var(--curtain) 0 18px, var(--curtain-2) 18px 24px, var(--curtain) 24px 36px); -webkit-mask: radial-gradient(18px 14px at 18px 0, #000 98%, transparent) 0 0 / 36px 14px repeat-x; mask: radial-gradient(18px 14px at 18px 0, #000 98%, transparent) 0 0 / 36px 14px repeat-x; pointer-events: none; }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 62px; }
.logo { display: flex; align-items: baseline; gap: 10px; font-family: var(--display); font-size: 26px; white-space: nowrap; }
.logo small { font-family: var(--sans); font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--brass-hi); }
nav.main { display: flex; gap: 4px; }
nav.main a, .bag-btn { padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
nav.main a.on { background: rgba(255, 255, 255, .12); }
nav.main a:hover, .bag-btn:hover { background: rgba(255, 255, 255, .08); }
.bag-n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 6px; border-radius: 11px; background: var(--brass); color: var(--ink); font-size: 12px; font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; border: 1px solid var(--ink); white-space: nowrap; }
.btn.dark { background: var(--curtain); color: var(--paper); border-color: var(--curtain); }
.btn.dark:hover { background: var(--ink); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.btn.small { padding: 8px 13px; font-size: 13.5px; }
.btn.block { width: 100%; }
.pill { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; }
.pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }

/* Home */
.rings { display: flex; gap: 16px; overflow-x: auto; padding: 30px 0 8px; scrollbar-width: none; }
.rings::-webkit-scrollbar { display: none; }
.ring { flex: none; width: 82px; display: grid; justify-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; text-align: center; }
.ring .o { width: 76px; height: 76px; border-radius: 50%; padding: 3px; background: var(--ring); }
.ring.seen .o { background: var(--line); }
.ring .i { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--wall); overflow: hidden; display: grid; place-items: center; }
.ring .i svg { width: 122%; height: 122%; margin-top: 20%; }
.ring .i .glyph { font-family: var(--story); font-size: 28px; color: #2a1018; }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 26px 50px; }
.hero h1 { font-size: clamp(46px, 6.4vw, 92px); line-height: .95; }
.hero h1 i { font-family: var(--story); font-style: italic; color: var(--curtain-2); }
.hero p { font-size: 18px; max-width: 46ch; color: var(--mute); }
.hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero-art { position: relative; aspect-ratio: 5 / 4; max-width: 100%; border-radius: 30px; overflow: hidden; background: radial-gradient(80% 70% at 50% 35%, #f9fbf8, var(--wall-2)); }
.hero-art .rod { position: absolute; left: 6%; right: 6%; top: 12%; height: 8px; border-radius: 4px; background: linear-gradient(var(--brass-hi), var(--brass) 60%, #7d5a26); }
.hero-art .hangs { position: absolute; left: 4%; right: 4%; top: 6%; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
.hero-art .hangs button svg { width: 100%; height: 100%; }
.hero-art .hint { position: absolute; left: 16px; bottom: 14px; background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.issue-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 22px; }
.issue-head h2 { font-size: clamp(36px, 4.6vw, 64px); line-height: .95; }
.issue-head h2 i { font-family: var(--story); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 18px; padding-bottom: 70px; }
.look-card .plate { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 20px; overflow: hidden; }
.look-card .plate svg { width: 100%; height: 100%; transition: transform .7s var(--ease); }
.look-card:hover .plate svg { transform: scale(1.04); }
.look-card .no { position: absolute; left: 14px; top: 10px; font-family: var(--story); font-style: italic; font-size: 26px; color: var(--ink); }
.look-card .left { position: absolute; right: 10px; top: 12px; background: var(--paper); color: var(--flag); font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
.look-card .try { position: absolute; left: 10px; right: 10px; bottom: 10px; text-align: center; background: rgba(248, 250, 247, .92); border-radius: 999px; padding: 8px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(6px); transition: .3s var(--ease); }
.look-card:hover .try, .look-card:focus-visible .try { opacity: 1; transform: none; }
.look-card .cap { display: flex; justify-content: space-between; gap: 10px; padding: 10px 4px 0; font-size: 14.5px; }
.look-card .cap b { font-weight: 600; }

/* Fitting room */
.room { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 36px; padding-block: 40px 60px; align-items: start; }
.mirror-col { position: sticky; top: 92px; display: grid; gap: 18px; }
.scene { position: relative; display: grid; place-items: center; padding: 0 10%; }
.curtain { position: absolute; top: -40px; bottom: 30px; width: 12%; background: repeating-linear-gradient(90deg, var(--curtain) 0 10px, var(--curtain-2) 10px 13px, var(--curtain) 13px 22px); border-radius: 0 0 40% 40%; box-shadow: inset -10px 0 20px rgba(0, 0, 0, .25); }
.curtain.l { left: 0; border-bottom-right-radius: 70%; }
.curtain.r { right: 0; border-bottom-left-radius: 70%; transform: scaleX(-1); }
.mirror { position: relative; width: 100%; max-width: 400px; aspect-ratio: 3 / 4.25; border-radius: 999px 999px 26px 26px / 48% 48% 26px 26px; padding: 12px; background: linear-gradient(150deg, var(--brass-hi), var(--brass) 40%, #7d5a26 70%, var(--brass-hi)); box-shadow: 0 30px 60px -30px rgba(23, 34, 30, .55); }
.glass { position: relative; width: 100%; height: 100%; border-radius: inherit; overflow: hidden; background: radial-gradient(90% 60% at 50% 30%, #fbfcfa 0%, #e8eee9 55%, #cfd9d2 100%); }
.glass::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .55) 38%, transparent 46%); pointer-events: none; z-index: 5; }
.glass::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: 4%; height: 5%; border-radius: 50%; background: radial-gradient(rgba(23, 34, 30, .22), transparent 70%); }
.stack { position: absolute; inset: 7% 4% 3%; z-index: 2; }
.stack svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stack svg.fresh { animation: drop .55s var(--ease); }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
.mirror-tag { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); z-index: 6; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: 13px; white-space: nowrap; box-shadow: 0 8px 20px -12px rgba(23, 34, 30, .5); }
.mirror-tag b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.look-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.look-top h2 { font-size: 28px; }
.look-total { font-size: 22px; font-weight: 600; }
.worn-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.sw { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; }
.sw svg { width: 100%; height: 100%; }
.worn-row b { font-weight: 600; font-size: 14.5px; display: block; line-height: 1.2; }
.worn-row small { color: var(--mute); font-size: 12.5px; }
.worn-row small.warn { color: var(--flag); font-weight: 600; }
.sel { border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; background: var(--paper); font-size: 14px; }
.x { width: 30px; height: 30px; border-radius: 50%; color: var(--mute); }
.x:hover { background: var(--wall); color: var(--ink); }
.look-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-top: 12px; }
.side-col { display: grid; gap: 18px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { padding: 12px 16px; font-weight: 500; color: var(--mute); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--ink); border-color: var(--ink); }
.who { display: grid; gap: 10px; }
.who-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.history { font-size: 13.5px; color: var(--mute); margin: 0; padding-left: 18px; }
.example { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--flag); }

/* Picks */
.picks-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
.picks-head h3 { font-size: 24px; }
.pick { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.pick .art { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; }
.pick .art svg { width: 100%; height: 100%; }
.pick b.nm { font-weight: 600; display: block; line-height: 1.25; }
.pick .sub { font-size: 13px; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--wall); color: var(--ink); }
.chip.warn { background: #f6e1e6; color: var(--flag); }
.score { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: conic-gradient(var(--curtain-2) calc(var(--s) * 1%), var(--wall-2) 0); position: relative; }
.score::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--paper); }
.score span { position: relative; }
.pick-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.why { grid-column: 1 / -1; display: grid; gap: 7px; background: var(--wall); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
.why-row { display: grid; grid-template-columns: 150px 90px minmax(0, 1fr) 34px; gap: 10px; align-items: center; }
.bar { height: 6px; border-radius: 3px; background: var(--wall-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--curtain-2); }
.weights { display: grid; gap: 10px; }
.w-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 36px; gap: 12px; align-items: center; font-size: 14px; }
.w-row input { width: 100%; accent-color: var(--curtain); }
details.how { border-top: 1px solid var(--line); padding-top: 10px; }
details.how summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.how summary::after { content: "+"; font-size: 20px; line-height: 1; }
details.how[open] summary::after { content: "–"; }
.about dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 0; margin: 12px 0 0; font-size: 14px; border-top: 1px solid var(--ink); }
.about dt, .about dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
.about dt { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding-top: 12px; }
.rail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.piece { position: relative; text-align: left; }
.piece .art { aspect-ratio: 3 / 4; max-width: 100%; }
.piece .art svg { width: 100%; height: 100%; }
.piece .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.piece .on-tag { position: absolute; left: 6px; top: 26px; background: var(--curtain); color: var(--paper); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; }
.rail-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

/* Trial room (staff) */
.trial { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 26px; padding-block: 34px 70px; align-items: start; }
.trial h1 { font-size: clamp(38px, 4.4vw, 58px); line-height: 1; }
.staff-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: var(--ink); color: var(--paper); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
.inroom { display: grid; gap: 0; }
.scan { display: flex; gap: 8px; margin-top: 12px; }
.scan select { flex: 1; min-width: 0; }
.fetch { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.fetch .art { aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; }
.fetch .art svg { width: 100%; height: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
.check.on { background: var(--good); border-color: var(--good); color: #fff; }

/* Panels */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(23, 34, 30, .42); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.panel { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); transform: translateX(102%); transition: transform .5s var(--ease); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.panel.on { transform: none; }
.panel-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 30px; }
.panel-body { flex: 1; overflow: auto; padding: 4px 22px; }
.panel-foot { padding: 16px 22px 22px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.b-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.b-row .art { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; }
.b-row .art svg { width: 100%; height: 100%; }
.qty { display: inline-flex; align-items: center; gap: 10px; margin-top: 4px; }
.qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.row.total { font-size: 18px; font-weight: 600; padding-top: 4px; }
.meter { height: 6px; border-radius: 3px; background: var(--wall-2); overflow: hidden; margin: 2px 0 6px; }
.meter i { display: block; height: 100%; background: var(--brass); }
.modal { position: fixed; z-index: 52; left: 50%; top: 50%; width: min(860px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow: auto; background: var(--paper); border-radius: 26px; padding: 24px; transform: translate(-50%, -46%); opacity: 0; pointer-events: none; transition: transform .4s var(--ease), opacity .3s; }
.modal.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.send { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.chat { background: #e9e4dc; border-radius: 22px; padding: 16px; display: grid; gap: 8px; }
.chat-top { display: flex; align-items: center; gap: 10px; font-size: 14px; padding-bottom: 8px; border-bottom: 1px solid rgba(0, 0, 0, .08); }
.chat-top .av { width: 34px; height: 34px; border-radius: 50%; background: var(--curtain); color: var(--brass-hi); display: grid; place-items: center; font-family: var(--display); }
.bubble { background: #fff; border-radius: 4px 16px 16px 16px; padding: 10px 12px; font-size: 14px; max-width: 92%; box-shadow: 0 1px 1px rgba(0, 0, 0, .06); }
.bubble .prods { display: grid; gap: 6px; margin-top: 8px; }
.bubble .prod { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; background: #f6f3ee; border-radius: 10px; padding: 6px; font-size: 13px; }
.bubble .prod .art { aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; }
.bubble .prod .art svg { width: 100%; height: 100%; }
.bubble .acts { display: grid; gap: 4px; margin-top: 8px; }
.bubble .acts span { text-align: center; color: #2b6cb0; font-weight: 600; font-size: 13.5px; padding: 7px; border-top: 1px solid #eee; }
.steps-list { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14.5px; }

/* Checkout */
.co { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 30px; padding-block: 40px 80px; }
.co .card { margin-bottom: 14px; }
.co h3 { font-size: 24px; margin-bottom: 10px; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--mute); margin-bottom: 12px; }
.input { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 0 14px; font: inherit; color: var(--ink); }
.input:focus { outline: none; border-color: var(--curtain); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pays { display: grid; gap: 8px; }
.pay { display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; }
.pay small { display: block; color: var(--mute); }
.pay.on { border-color: var(--curtain); box-shadow: inset 0 0 0 1px var(--curtain); }
.demo { background: var(--wall-2); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; }
.sum-card { position: sticky; top: 96px; align-self: start; }

/* Story viewer (dark) */
.viewer { position: fixed; inset: 0; z-index: 60; background: rgba(8, 6, 8, .94); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

    const likes = cust.colours.includes(p.colour);
    const returned = cust.returned.find((r) => r.code === p.code);

    why.taste = returned ? `She returned this before (${returned.why})` : [inBand ? `In her usual ${rupees(cust.band[0])}–${rupees(cust.band[1])}` : `Outside her usual ${rupees(cust.band[0])}–${rupees(cust.band[1])}`, likes ? `she has bought ${p.colour.toLowerCase()} before` : ""].filter(Boolean).join("; ");

function picksFor(worn, cust, mySize, weights, where = "online") {

    <div class="weights">${PARTS.map((k) => `<div class="w-row"><label for="w-${k.key}">${k.name}</label><input type="range" id="w-${k.key}" min="0" max="40" value="${weights[k.key]}" oninput="weights['${k.key}']=+this.value;this.nextElementSibling.textContent=this.value;keepPrefs()" onchange="drawRoomOrTrial()"><span class="num">${weights[k.key]}</span></div>`).join("")}</div>
    <button class="btn small" style="margin-top:12px" onclick="weights=Object.fromEntries(PARTS.map((k)=>[k.key,k.w]));keepPrefs();drawRoomOrTrial()">Back to the starting weights</button>
    <ol class="steps-list">
      <li><b>Her size in stock.</b> Her size from her past orders and exchanges, or what she picks. A piece that runs small offers one size up. Live stock decides: 2 or more left is full marks, the last one a little less, the next size if hers is sold out.</li>
      <li><b>Styled together.</b> The pairs the staff mark in the catalogue ("goes with").</li>
      <li><b>Colours.</b> Neutrals go with anything; some colour pairs work better than others.</li>
      <li><b>Occasion.</b> Brunch, work, date night or getaway, shared with what is on the form.</li>
      <li><b>Her taste.</b> Her usual spend and colours from past orders; anything she returned scores zero.</li>
      <li><b>The shop's push.</b> New pieces, and pieces on the rail for 45 days or more, get a lift.</li>
    </ol>
    <p class="mute" style="font-size:13.5px">Later, once there are a few hundred orders, "bought together" and "kept or returned" from real orders join as two more parts.</p></div>`;
}
function drawRoomOrTrial() { if ($("#stack")) drawRoom(); else if ($("#trialPicks")) drawTrial(); }
function addLook() {
  const out = [];
  for (const c of worn()) { const m = bagAdd(c, sizeFor(c)); if (m) out.push(m); }
  updateN(); if (out.length) toast(out[0]); openBag();
}

function drawTrial() {

  $("#trialWho").innerHTML = c.band ? `<ul class="history">${c.history.map((h) => `<li>${h}</li>`).join("")}</ul>` : `<div class="who-row"><span class="label mute">Her size</span>${["XS", "S", "M", "L", "XL"].map((k) => `<button class="pill ${k === trialSize ? "on" : ""}" onclick="trialSize='${k}';drawTrial()">${k}</button>`).join("")}</div>`;
  $("#inRoom").innerHTML = inRoom.length ? inRoom.map((code) => { const p = byCode[code]; return `<div class="worn-row" style="grid-template-columns:44px minmax(0,1fr) auto"><span class="sw" style="background:${p.bg}">${garment(p, { label: false, viewBox: "60 70 180 200" })}</span><span><b>${p.name}</b><small>${p.code} · ${rupees(p.price)}</small></span><button class="x" aria-label="Out of the room" onclick="inRoom=inRoom.filter((x)=>x!=='${code}');drawTrial()">✕</button></div>`; }).join("") : `<p class="mute">Nothing scanned yet.</p>`;

function scanIn() { const code = $("#scanSel").value; if (!inRoom.includes(code)) inRoom.push(code); drawTrial(); }
function toggleBring(code) { brought.has(code) ? brought.delete(code) : brought.add(code); if (brought.has(code) && !inRoom.includes(code)) inRoom.push(code); drawTrial(); }
function sideTabTo(t) { $("#modal").innerHTML = howCard() + `<div style="margin-top:12px"><button class="btn dark" onclick="closeAll();drawTrial()">Done</button></div>`; $("#modal").classList.add("on"); $("#scrim").classList.add("on"); }

/* ------------------------------------------------------------------ Sending the picks */
function sendModal(where) {
  const c = where === "store" ? CUSTOMERS[trialCust] : cust();

  else { lookCodes = worn(); picks = picksFor(lookCodes, c, mySize, weights).slice(0, 3); }
  const name = c.band ? c.name : "there";
  const anchor = byCode[lookCodes[lookCodes.length - 1]] || P[0];
  $("#modal").innerHTML = `<div class="send">
    <div><div class="label mute">What she receives · preview</div>
      <div class="chat" style="margin-top:10px"><div class="chat-top"><span class="av">H</span><div><b>The Hanger</b><br><span class="mute" style="font-size:12px">Business account</span></div></div>
        <div class="bubble">Hi ${name}! The ${anchor.name.toLowerCase()} looks lovely with these. All three are in your size and in stock today:
          <div class="prods">${picks.map((r) => `<div class="prod">${art(r.p)}<div><b>${r.p.name}</b><br>${rupees(r.p.price)} · size ${r.fit.size}${r.fit.n <= 2 ? ` · ${r.fit.n} left` : ""}</div></div>`).join("")}</div>

      </div></div>
    <div><h2 style="font-size:32px">How this is sent</h2>
      <ol class="steps-list">
        <li>The picks go as a WhatsApp <b>product message</b> from the shop's Meta catalogue, which the platform already keeps in sync. She opens the pieces, picks a size and adds them to a cart inside WhatsApp.</li>
        <li>Her cart comes back to the platform's WhatsApp order flow that is already built: address, then UPI link or cash on delivery, then the GST invoice.</li>
        <li>WhatsApp's rules: she must have agreed to messages (asked once at the counter or checkout). Within 24 hours of her last message it is a normal reply; after that it goes as a pre-approved marketing template, which Meta charges for per message.</li>

/* ------------------------------------------------------------------ Bag, checkout */
function updateN() { $("#bagN").textContent = bagQty(); }
function closeAll() { ["#panel", "#modal", "#scrim"].forEach((s) => $(s).classList.remove("on")); }
function openBag() { drawBag(); $("#panel").classList.add("on"); $("#scrim").classList.add("on"); }
function drawBag() {
  const t = bagTotal(), d = deliveryFor(t), away = Math.max(0, FREE_SHIP - t);
  $("#panel").innerHTML = `<div class="panel-head"><h2>Your bag</h2><button class="x" aria-label="Close bag" onclick="closeAll()">✕</button></div>
  <div class="panel-body">${bag.length ? bag.map((l, i) => { const p = byCode[l.code]; return `<div class="b-row">${art(p)}<div><b style="font-weight:600">${p.name}</b><div class="mute" style="font-size:13px">Size ${l.size}</div><div class="qty"><button aria-label="One less" onclick="bagStep(${i},-1);updateN();drawBag()">−</button><span class="num">${l.qty}</span><button aria-label="One more" onclick="bagStep(${i},1);updateN();drawBag()">+</button></div></div><b class="num">${rupees(p.price * l.qty)}</b></div>`; }).join("") : `<div style="padding:50px 0;text-align:center"><h3 style="font-size:28px">Nothing in the bag yet</h3><p class="mute">Try a piece on and add the whole look in one tap.</p><a class="btn dark" href="#room" onclick="closeAll()">Open the fitting room</a></div>`}</div>
  ${bag.length ? `<div class="panel-foot"><div class="mute" style="font-size:13.5px">${away ? `${rupees(away)} more for free delivery` : "Free delivery unlocked"}</div><div class="meter"><i style="width:${Math.min(100, (t / FREE_SHIP) * 100)}%"></i></div><div class="row"><span>Delivery</span><span class="num">${d ? rupees(d) : "Free"}</span></div><div class="row total"><span>Total, GST included</span><span class="num">${rupees(t + d)}</span></div><a class="btn dark block" style="margin-top:8px" href="#checkout" onclick="closeAll()">Checkout</a></div>` : ""}`;
}
let pay = "upi", lastOrder = null;
function checkoutPage() {
  if (!bag.length) return `<div class="wrap" style="padding:80px 0;text-align:center"><h1 style="font-size:44px">Your bag is empty</h1><p><a class="btn dark" href="#room">Open the fitting room</a></p></div>`;
  pay = "upi";
  return `<div class="wrap co"><div>
      <h1 style="font-size:clamp(40px,5vw,60px);margin-bottom:14px">Checkout</h1>
      <p class="demo">Design preview: no code is sent, no payment is taken and no order is placed. Try it with made-up details.</p>
      <div class="card"><h3>Your number</h3><div class="field">WhatsApp number<input class="input" id="coPhone" inputmode="tel" maxlength="10" placeholder="10-digit mobile number" /></div><label class="mute" style="font-size:13.5px;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="coOpt" checked style="margin-top:4px" /> Send me order updates and picks for my size on WhatsApp. I can stop them any time.</label></div>
      <div class="card"><h3>Delivery address</h3><div class="two"><div class="field">Full name<input class="input" id="coName" /></div><div class="field">Pincode<input class="input" id="coPin" inputmode="numeric" maxlength="6" placeholder="452010" oninput="pinFill()" /></div></div><div class="field">House, street, area<input class="input" id="coAddr" /></div><div class="two"><div class="field">City<input class="input" id="coCity" /></div><div class="field">State<input class="input" id="coState" /></div></div></div>
      <div class="card"><h3>Payment</h3><div class="pays">${[["upi", "UPI", "Any UPI app"], ["card", "Card", "Debit or credit"], ["cod", "Cash on delivery", "Pay when it arrives"]].map(([k, a, b]) => `<button type="button" class="pay ${k === "upi" ? "on" : ""}" data-k="${k}" onclick="setPay('${k}')"><span>${a}<small>${b}</small></span></button>`).join("")}</div></div>
    </div><aside class="card sum-card" id="sumCard"></aside></div>`;
}
function setPay(k) { pay = k; document.querySelectorAll(".pay").forEach((b) => b.classList.toggle("on", b.dataset.k === k)); drawSum(); }
function pinFill() { const v = $("#coPin").value.replace(/\D/g, ""), pl = pinPlace(v); if (pl && pl[0]) { $("#coCity").value = pl[0]; $("#coState").value = pl[1]; } drawSum(); }
function drawSum() {
  const t = bagTotal(), d = deliveryFor(t), pin = ($("#coPin")?.value || "").replace(/\D/g, "");
  $("#sumCard").innerHTML = `<h3>Your order</h3>${bag.map((l) => { const p = byCode[l.code]; return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${p.name} · ${l.size}${l.qty > 1 ? ` × ${l.qty}` : ""}</span><span class="num">${rupees(p.price * l.qty)}</span></div>`; }).join("")}
    <div class="row" style="padding-top:8px"><span>Delivery</span><span class="num">${d ? rupees(d) : "Free"}</span></div><div class="row mute"><span>GST included</span><span class="num">${rupees(Math.round(t - t / 1.05))}</span></div><div class="row total"><span>Total</span><span class="num">${rupees(t + d)}</span></div>
    <p class="mute" style="font-size:13.5px">${/^\d{6}$/.test(pin) ? `Arrives <b style="color:var(--ink)">${etaFor(pin).toLowerCase()}</b>` : "Add your pincode to see the delivery day."}</p>
    <button class="btn dark block" onclick="placeOrder()">${pay === "cod" ? "Place order" : `Pay ${rupees(t + d)}`}</button>`;
}
function placeOrder() {
  const phone = $("#coPhone").value.replace(/\D/g, ""), pin = $("#coPin").value.replace(/\D/g, "");
  if (phone.length !== 10) return toast("Add a 10-digit mobile number.");
  if (!$("#coName").value.trim() || !$("#coAddr").value.trim() || pin.length !== 6) return toast("Add your name, address and a 6-digit pincode.");
  lastOrder = { n: 1000 + Math.floor(Math.random() * 9000), eta: etaFor(pin), total: bagTotal() + deliveryFor(bagTotal()), names: bag.map((l) => byCode[l.code].name) };
  bag = []; saveBag(); updateN(); location.hash = "#thanks";
}
function thanksPage() {
  if (!lastOrder) return `<div class="wrap" style="padding:80px 0;text-align:center"><h1 style="font-size:44px">No order yet</h1><p><a class="btn dark" href="#room">Open the fitting room</a></p></div>`;
  return `<div class="wrap" style="padding:70px 0 90px;text-align:center"><div class="label mute">Order HWH-${lastOrder.n} · ${rupees(lastOrder.total)} · design preview</div><h1 style="font-size:clamp(60px,10vw,130px);line-height:.9;margin-top:14px">It's <i style="font-family:var(--story)">yours.</i></h1><p style="font-size:18px;max-width:44ch;margin:16px auto 24px">${lastOrder.names.join(", ")}. Packed by hand at MG Road and at your door ${lastOrder.eta.toLowerCase()}. Tracking comes on WhatsApp.</p><a class="btn dark" href="#home">Back to the drop</a></div>`;
}

/* ------------------------------------------------------------------ Router */
function route() {
  const [page, sub] = parseHash();
  closeAll();
  if (page === "story") { if (!$("#grid")) { $("#main").innerHTML = home(); drawGrid(); } return openStory(sub); }
  closeStory();
  const main = $("#main");
  if (page === "try" && byCode[sub]) { const p = byCode[sub]; if (!$("#stack")) main.innerHTML = room(); sideTab = "picks"; if (SLOT_OF(p) === "layer" && look.layer === p.code) { focus = p.code; drawRoom(); } else wear(p.code); }
  else if (page === "room") { main.innerHTML = room(); drawRoom(); }
  else if (page === "trial") { main.innerHTML = trialPage(); drawTrial(); }
  else if (page === "checkout") { main.innerHTML = checkoutPage(); if (bag.length) drawSum(); }
  else if (page === "thanks") main.innerHTML = thanksPage();
  else { main.innerHTML = home(); drawGrid(); }
  document.querySelectorAll("nav.main a").forEach((a) => a.classList.toggle("on", a.dataset.nav === (page === "try" ? "room" : page || "home")));
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (story) location.hash = "#home"; closeAll(); }
  if (story && e.key === "ArrowRight") stepStory(1);
  if (story && e.key === "ArrowLeft") stepStory(-1);
});
updateN();
route();

let lookIdx = 0;
try { const saved = localStorage.getItem("hanger-look"); const i = LOOKS.findIndex((l) => l.id === saved); if (i > 0) lookIdx = i; } catch (e) { /* storage blocked */ }

      <div class="looks-step"><button onclick="setLook(lookIdx-1)">← Previous</button><button onclick="setLook(lookIdx+1)">Next →</button></div>

    <button class="looks-tab" onclick="looksOpen=!looksOpen;drawLooks()" aria-expanded="${looksOpen}"><span class="sw" style="background:linear-gradient(135deg,${look.sw[0]} 50%,${look.sw[1]} 50%)"></span>Theme ${lookIdx + 1}/8 · ${look.name}</button>`;
